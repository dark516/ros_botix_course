# Parameters for the Botix bridge.
#
# Encoder scale is calibrated on the ESP32 through the separate
# device.encoder.left_mm_per_tick and device.encoder.right_mm_per_tick fields.
# These values describe the geometry used by ROS differential-drive kinematics.
botix_bridge:
  ros__parameters:
    robot_host: botix.local
    robot_port: 14550
    local_port: 14555
    lidar_port: 14560

    # distance between wheel contact patches, metres
    wheel_separation: 0.1754
    wheel_radius: 0.0338

    # speed at which cmd_vel saturates the robot's 0..1000 command range
    max_linear_speed: 0.5
    max_angular_speed: 3.0

    # the tank mixer turns clockwise for positive r; ROS wants counter-clockwise
    invert_turn: true

    scan_bins: 360
    range_min: 0.02
    range_max: 12.0
    lidar_frame: laser_frame
    angle_offset_deg: 0.0

    odom_frame: odom
    base_frame: base_footprint
    publish_tf: true

    command_rate: 20.0
    command_timeout: 0.5
