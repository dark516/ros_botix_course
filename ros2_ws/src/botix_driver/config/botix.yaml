# Parameters for the Botix bridge.
#
# The kinematic values are placeholders measured on one chassis. Wheel base and
# mm_per_tick decide whether odometry means anything, so calibrate them before
# trusting /odom: drive a measured straight line and a measured full turn, then
# scale until the reported motion matches.
botix_bridge:
  ros__parameters:
    robot_host: botix.local
    robot_port: 14550
    local_port: 14555
    lidar_port: 14560

    # distance between wheel contact patches, metres
    wheel_base: 0.15
    # must match device.encoder.mm_per_tick on the robot
    mm_per_tick: 1.0

    # speed at which cmd_vel saturates the robot's 0..1000 command range
    max_linear_speed: 0.5
    max_angular_speed: 3.0

    # the left motor is mounted mirrored, so its encoder counts down going forward
    left_ticks_sign: -1
    right_ticks_sign: 1
    # the tank mixer turns clockwise for positive r; ROS wants counter-clockwise
    invert_turn: true

    scan_bins: 360
    range_min: 0.02
    range_max: 12.0
    lidar_frame: laser
    angle_offset_deg: 0.0

    odom_frame: odom
    base_frame: base_link
    publish_tf: true

    command_rate: 20.0
    command_timeout: 0.5
